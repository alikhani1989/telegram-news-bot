name: خبرخوان مجلس

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: اجرای ربات
        run: timeout 420 node index.js || true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NARA_ROUTER_API_KEY: ${{ secrets.NARA_ROUTER_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DESTINATION_CHAT_ID: '@selectednewsmajlis'
          SOURCE_CHANNEL_ID: news_parliament

      - name: ذخیره وضعیت در مخزن
        run: |
          git config user.name "News Bot"
          git config user.email "bot@github-actions"
          git add state.json
          git diff --staged --quiet || git commit -m "🔄 بروزرسانی خودکار وضعیت [skip ci]"
          git push
